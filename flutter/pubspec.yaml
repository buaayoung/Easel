name: easel_app
description: Easel desktop host — Flutter UI + local FastAPI sidecar.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/easel-icon-transparent.png
